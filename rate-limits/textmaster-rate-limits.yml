    available to overcome this issue."
  source: https://developer.textmaster.com/overview/troubleshooting
  mitigation: >-
    Use POST /v1/clients/projects/{project_id}/async_launch,
    POST /v1/clients/projects/{project_id}/batch/documents and
    POST /v1/clients/projects/{project_id}/batch/documents/complete.
