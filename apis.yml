apis:
- name: TextMaster API v1
  description: >-
    OpenAPI 3.0.3-described REST API for ordering and managing translation, proofreading and
    copywriting work. 54 operations across Projects (create, quote, finalize, launch sync/async,
    pause, resume, cancel, archive, duplicate, translation-memory options), Documents (single and
    batch create/complete, review URLs, support messages), My Authors, Glossaries, Work and API
    Templates, Abilities, Negotiated Contracts, Transactions, Invoices, Receipts, Uploads and
    Users, plus an unauthenticated public reference surface for categories, countries,
    expertises, languages and locales. Authenticated with OAuth 2.0 bearer tokens (22 scopes) or
    the legacy Apikey/Date/Signature header strategy. Asynchronous progress is delivered by
    status-change callbacks (webhooks) rather than polling.
  humanURL: https://developer.textmaster.com/
