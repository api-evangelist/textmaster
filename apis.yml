aid: textmaster
name: TextMaster
description: >-
  TextMaster is a French professional translation, proofreading and copywriting platform that
  sells human-and-machine language work as an API-first service in 50+ languages. Clients create
  Projects, attach Documents (plain text or file URLs), request a quotation, launch against a
  prepaid credit wallet, and receive finished content back through status-change webhooks. The
  platform exposes a documented OpenAPI 3.0.3 REST API at api.textmaster.com covering projects,
  documents, glossaries, expertises, preferred authors, work/API templates, transactions,
  invoices and receipts, secured by OAuth 2.0 authorization-code apps with 22 granular scopes
  plus a legacy signature strategy. It ships first-party Akeneo, Magento 2, Salesforce Commerce
  Cloud and Hybris connectors and a PHP API client. TextMaster is now part of Acolad Group; the
  marketing site is a transition landing page pointing at Acolad's Lia platform, while the
  application, the API and the developer portal remain live and in service.
