summary: >-
  TextMaster is mid-transition into Acolad Group, and the lifecycle picture is genuinely split: the
  RUNTIME is healthy and monitored (a live status page tracking ten hosts, valid certs, an API
  answering /ping in 18ms), while the CORPORATE and LEGAL surfaces are being wound down (the
  marketing site is now a one-page Acolad transition landing page, and the application's own
  terms-of-use and privacy links 301 to that landing page). Both facts are recorded here because
  either one alone would misrepresent the provider.
