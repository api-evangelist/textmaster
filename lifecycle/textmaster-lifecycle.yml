corporate_status:
  parent: Acolad Group
  relationship_quote: >-
    "TextMaster is part of Acolad — a global leader in content solutions and language services."
    "(c) 2026 Acolad Group. TextMaster is an Acolad company."
  transition_announced: true
  transition_headline: 'TextMaster has joined Acolad — Meet Lia, the platform for all your translation needs.'
  successor_product: 'Lia (https://www.acolad.com/en/lia)'
  source: https://www.textmaster.com/
  checked: '2026-08-17'
  platform_continuity_quote: >-
    "Is my TextMaster account still active? Yes. You can continue to sign in and manage your
    projects at app.textmaster.com. We'll notify you directly of any future changes that affect
    your account." / "Existing projects and pricing remain unchanged."
  api_continuity_assessment: >-
    No end-of-life date has been announced for the TextMaster API. Evidence that it remains in
    service on 2026-08-17: the OpenAPI is served live from two hosts, /ping answers 200 in 18ms,
    the developer portal is complete and was reachable in full, the status page monitors ten
    production hosts at 30s–10min intervals, and TLS certificates were reissued on 2026-08-11.
    Evidence of wind-down risk: the customer-facing brand site is a single transition page with a
    2026-05-25 lastmod, all commercial and legal pages have been 301'd away, and every call to
    action routes to Acolad. Treat the API as live-but-sunsetting and re-check on the next round.
legal_link_rot:
  finding: >-
    https://app.textmaster.com/sign_up still links "terms of use" and "privacy policy" to
    https://www.textmaster.com/terms-of-use and /privacy-policy. Both now return HTTP 301 to
    https://www.textmaster.com/ — the Acolad transition landing page. A user signing up today
    cannot read the terms they are agreeing to at the URL the form points to.
  probed:
  - url: https://www.textmaster.com/terms-of-use
    status: 301
    redirects_to: https://www.textmaster.com/
    checked: '2026-08-17'
  - url: https://www.textmaster.com/privacy-policy
    status: 301
    redirects_to: https://www.textmaster.com/
    checked: '2026-08-17'
  pointer_decision: >-
    NO `TermsOfService` pointer is emitted — TextMaster no longer publishes a resolvable terms
    document, and crediting a 301-to-marketing-page would be soft-404 false credit. A
    `PrivacyPolicy` pointer IS emitted, at
    https://www.acolad.com/en/legal-notices/website-privacy-policy (HTTP 200), because that is the
    document TextMaster's own site footer links as its privacy policy.
  parent_legal_surface:
  - url: https://www.acolad.com/en/legal-notices
    status: 200
    label: Legal Notices (linked from the TextMaster footer)
  - url: https://www.acolad.com/en/legal-notices/website-privacy-policy
    status: 200
    label: Website Privacy Policy (linked from the TextMaster footer)
  - url: https://www.acolad.com/en/legal-notices/website-terms
    status: 200
    label: Website Terms (Acolad's own site terms; governs acolad.com, not the TextMaster platform)
