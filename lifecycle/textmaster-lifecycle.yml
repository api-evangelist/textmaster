deprecation:
  policy_documented: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  probed_headers_on:
  - url: https://api.textmaster.com/ping
    status: 200
    deprecation_header_present: false
    sunset_header_present: false
    checked: '2026-08-17'
  pointer_decision: >-
    NO `Deprecation` pointer is emitted in apis.yml. TextMaster publishes individual deprecation
    NOTICES (below) but no deprecation POLICY: there is no stated notice period, no sunset date, no
    RFC 8594 Sunset/Deprecation header support, and no deprecations index. The operational
    `deprecation_policy` check must read a genuine zero here rather than be credited from the
    notices.
  documented_deprecations:
  - feature: Loop
    kind: product feature (email-to-project intake)
    status: deprecated
    sunset_date: null
    quote: >-
      "Loop is deprecated and will be removed in the future. Use the REST API instead. The
      following documentation is for clients already using this feature."
    source: https://developer.textmaster.com/overview/loop
    note: >-
      An explicit deprecation with a stated migration path (the REST API) but no date. The docs
      page is retained for existing users, which is good practice.
  - feature: 'query parameter `locale` on GET /v1/clients/projects/quotation'
    kind: API parameter
    status: deprecated
    sunset_date: null
    quote: '[DEPRECATED] Locale used to display the pricing (defaults to en-EU).'
    source: openapi/textmaster-api-v1-openapi.yml
  deprecated_operations: []
  deprecated_operations_note: >-
    No operation in the spec carries `deprecated: true`. The only spec-level deprecation is the
    parameter description above, which is prose rather than the machine-readable `deprecated` flag —
    a generated client will not surface it.
  redirect_as_deprecation_signal:
    quote: >-
      "If you receive a redirect, it's best to update your code to follow the new URI, in case
      you're requesting a deprecated path that we might remove."
    source: https://developer.textmaster.com/guides/integrator-best-practices
    note: >-
      TextMaster's actual removal mechanism appears to be 301-then-remove rather than
      Deprecation/Sunset headers.
