checked: '2026-08-17'
summary: >-
  A complete negative result on RFC 8615. TextMaster serves NOTHING at /.well-known/ on any host:
  no security.txt, no OIDC discovery, no OAuth authorization-server or protected-resource metadata,
  no api-catalog, no ai-plugin.json and no A2A agent card. 32 probes across four hosts, zero
  documents. Recorded because an absence is data — and because the API is genuinely OAuth 2.0, so
  the missing RFC 8414 metadata is a real, fixable gap rather than an inapplicable check.
pointer_basis: >-
  NO `WellKnown` pointer and NO `SecurityTxt` pointer are emitted in apis.yml. Every path 404s or
  403s; there is no served document to point at. Do not add either pointer in a later round on the
  strength of this file existing — this file documents an absence.
  ONE pointer IS earned from this probe: `ContentSignal`, on the strength of the Content-Signal
  declaration in the developer portal's robots.txt (see content_signals below). That is a real,
  provider-published consent declaration; it just does not live under /.well-known/.
