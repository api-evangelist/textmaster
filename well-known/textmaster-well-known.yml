  hosts_probed: [api.textmaster.com, www.textmaster.com, fr.textmaster.com, docs.textmaster.com]
  note: >-
    No A2A agent card on any host at either the canonical or the legacy path. Per the pipeline
    contract this artifact is SEARCH-ONLY, so no a2a/ directory is created, no stub is written and
    no `AgentCard` pointer is emitted.
