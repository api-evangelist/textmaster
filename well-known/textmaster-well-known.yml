security_txt:
  present: false
  note: >-
    RFC 9116 is unimplemented on every host. This is a notable omission specifically because
    TextMaster DOES run a real bug bounty program with a dedicated bounty@textmaster.com address and
    a published policy — a security.txt would cost nothing and would make the program discoverable
    by machine. See security/textmaster-vulnerability-disclosure.yml for what is published instead.
oauth_metadata:
  present: false
  note: >-
    The API is a real OAuth 2.0 authorization-code provider (authorize + token + refresh endpoints,
    22 scopes) but publishes no RFC 8414 authorization-server metadata and no RFC 9728
    protected-resource metadata. A client cannot discover the endpoints or the scope list
    programmatically; both must be read out of the human documentation or the OpenAPI.
  endpoints_that_would_be_advertised:
    authorization_endpoint: https://api.textmaster.com/oauth/authorize
    token_endpoint: https://api.textmaster.com/oauth/token
    scopes_supported_count: 22
    see: scopes/textmaster-scopes.yml
agent_card:
