  "/v1/clients/authors":
    get:
      summary: List all potential authors for a project
      tags:
      - Authors
      security:
      - oauth2: []
      parameters:
      - name: project[activity_name]
        in: query
        required: false
        description: |
          Type of project to filter on.

          Possible values:

          * translation
          * copywriting
          * proofreading
        schema:
          type: string
          enum:
          - translation
          - copywriting
          - proofreading
      - name: project[language_from]
        in: query
        required: false
        description: 'Source language for translation projects (ex: fr-FR).'
        schema:
          type: string
          pattern: "^[a-z]{2}-[A-Z]{2}$"
      - name: project[language_to]
        in: query
        required: false
        description: 'Target language (ex: en-US)'
        schema:
          type: string
          pattern: "^[a-z]{2}-[A-Z]{2}$"
      - name: project[options][expertise]
        in: query
        required: false
        description: An Expertise ID (See List Expertises for more info)
        schema:
          type: string
      - name: project[options][language_level]
        in: query
        required: false
        description: An Expertise ID (See List Expertises for more info)
        schema:
          type: string
          enum:
          - enterprise
          - premium
      - name: page
        in: query
        required: false
        description: Search results are limited to 100 items. Specify page number
          to read more than the first page.
        schema:
          type: integer
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                example_0:
                  value:
                    error: invalid_token
                    error_description: The access token is invalid
                    state: unauthorizez
        '200':
          description: Lists Potential Authors
          content:
