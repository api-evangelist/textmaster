                        completed. Such operations are, for example, counting the
                        number of words on each Document and running the translation
                        memory analysis on the Project and its Documents (defaults
                        to false).
                      type: boolean
                    callback:
                      description: List of callbacks to be called upon Project status
                        changes.
                      type: object
                      properties:
                        project_in_progress:
                          type: object
                          properties:
                            url:
                              type: string
                          required:
                          - url
                        project_tm_completed:
                          type: object
                          properties:
                            url:
                              type: string
                          required:
                          - url
                        project_finalized:
                          type: object
                          properties:
                            url:
                              type: string
                          required:
                          - url
                        project_tm_diff_completed:
                          type: object
                          properties:
                            url:
                              type: string
                          required:
                          - url
                        project_in_review:
                          type: object
                          properties:
                            url:
                              type: string
                          required:
                          - url
                        project_cancelled:
                          type: object
                          properties:
                            url:
                              type: string
                          required:
                          - url
                        project_canceled:
                          type: object
                          properties:
                            url:
                              type: string
                          required:
                          - url
                        project_not_launched:
                          type: object
                          properties:
                            url:
                              type: string
                          required:
                          - url
                    category:
                      description: '(required) Code representing a category (eg: "C014").
                        Full list available via API call.'
                      type: string
                    custom_data:
                      description: Arbitrary structured data to attach to a Project
                      type: object
                    deadline:
                      description: You can add an optional deadline to inform the
                        author when the project should be delivered by. Please note
                        that this deadline is not enforced and serve for informational
                        purposes. Finally, please make sure you provide a realistic
                        deadline in order not to impact negativaly the selection of
                        your project by the authors. Must be a string in "YYYY-MM-DD"
                        or "YYYY-MM-DD hh:mm:ss" format.
                      type: string
                    documents:
                      description: In case Documents are already known when creating
                        the projects, Documents fields can be encapsulated inside
                        the project. This Document will appear after creation in the
                        Documents list field of the project. For more details on the
                        Document fields to add, refer to the Documents endpoint.
                      type: array
                      items:
                        "$ref": "#/components/schemas/Document"
                    glossaries:
                      description: An array of IDs listing the Glossaries to add to
                        the project.
                      type: array
                      items:
                        type: string
                    grammatical_person:
                      description: |
                        Which personal pronoun should the content be written with?

                        * not_specified: Same as "first_person_singular"
                        * first_person_singular: I
                        * second_person_singular: You
                        * third_person_singular_masculine: He
                        * third_person_singular_feminine: She
                        * third_person_singular_neuter: It
                        * first_person_plural: We
                        * second_person_plural: You
                        * third_person_plural: They
                      type: string
                    language_from:
                      description: "(required) Bigram representing a language (ex:
                        en-us). Full list available via API call."
                      type: string
                      pattern: "^[a-z]{2}(-[a-z]{2})?$"
                    language_to:
                      description: "(required for translation projects) Bigram representing
                        a language (ex: en-us). Full list available via API call."
                      type: string
                      pattern: "^[a-z]{2}(-[a-z]{2})?$"
                    name:
                      description: "(required) Name of the Project"
                      type: string
                    options:
                      description: "(required) Options for the Project"
                      type: object
                      properties:
                        expertise:
                          type: string
                        language_level:
                          type: string
                        quality:
                          type: boolean
                        priority:
                          type: boolean
                        specific_attachment:
                          type: boolean
                        uniq_author:
                          type: boolean
                        translation_memory:
                          type: boolean
                        translation_diff:
                          type: boolean
                      required:
                      - language_level
                    project_briefing:
                      description: "(required) This is where you have to provide the
                        general instructions for the project. All the information
                        must be common to all documents and allow the authors to carry
                        out their task in the best possible conditions. Providing
                        more details will increase your chances of getting the best
                        content."
                      type: string
                    project_briefing_is_rich:
                      description: |
                        Specifies if project briefing contains rich formatting (defaults to false).

                        Unless 'true', HTML in briefing is escaped when displayed.

                        Allowed tags (the rest is stipped):
                        div h1 h2 h3 h4 h5 h6 p br a b strong i em u del strike ul ol li
                      type: boolean
                    target_reader_groups:
                      description: |
                        What is the age population target audience of this project?

                        * not_specified (default): Any age
                        * children: 0–13
                        * teenager: 14–18
                        * young_adults: 19–29
                        * adults: 30–59
                        * old_adults: 60+
                      type: string
                    textmasters:
                      description: Provide an array with the IDs of the authors you’d
                        like to give the job to.
                      type: array
                      items:
                        type: string
                    vocabulary_type:
                      description: |
                        What style are you expecting your content to be written with?

                        * not_specified (default): Same as "popular"
                        * popular: based on simple, every day words and sentences
                        * technical: focused on precise and specific terms
                        * fictional: writing style amplified, expanded and scripted
                      type: string
                    work_template:
                      description: Select the template that fits your project (defaults
                        to "Libre", no specifications about structure of work). This
                        choice will determine how the content is organized in each
                        Document that will be produced. Full list available via API
                        call.
                  required:
                  - activity_name
                  - category
                  - language_from
                  - name
                  - options
                  - project_briefing
              required:
              - project
