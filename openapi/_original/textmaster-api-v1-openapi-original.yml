              examples:
                example_0:
                  value:
                    total_pages: 1
                    count: 2
                    page: 1
                    per_page: 20
                    previous_page:
                    next_page:
                    authors:
                    - id: 61698a9a8b81926d91c0e28c
                      ident: A-988C-FM
                    - id: 61698a9a8b81926d91c0e299
                      ident: A-9899-FM
