- {from: Project, to: Project, kind: has_many, via: multi_project_id, confidence: medium, note: 'Sibling grouping for projects submitted together.'}
- {from: Project, to: CallbackUrl, kind: has_many, via: 'callback.<project_event>', confidence: high}
- {from: Document, to: CallbackUrl, kind: has_many, via: 'callback.<document_event>', confidence: high}
