- {from: Document, to: SupportMessage, kind: has_many, via: 'path nesting', confidence: high}
- {from: SupportMessage, to: PotentialAuthor, kind: has_one, via: author_id, confidence: high}
- {from: MyAuthor, to: PotentialAuthor, kind: has_one, via: author_id, confidence: high}
