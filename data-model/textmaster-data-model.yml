modelling_gaps:
- >-
  No foreign key ties financial records to the work that generated them. Transaction, Invoice and
  Receipt carry no project_id or document_id in their schemas, so an integrator cannot join spend back
  to a project from the API alone — the reconciliation has to be done on timestamps and amounts.
  This is the most consequential gap in the model for anyone automating cost attribution.
- >-
  Status vocabularies are not declared as enums. Project and Document statuses, activity names and
  the MyAuthor relationship states are all bare strings; the permitted values live in prose
  descriptions, filter examples and one 422 validation example. A generated client gets no type
  safety on the fields that drive the entire workflow. The 19 documented webhook event names are the
  best available authority for the status vocabulary — see asyncapi/textmaster-event-surface.yml.
- >-
  Glossary, and the whole glossary:write / glossary:manage scope pair, exist without any write
  operation in v1. Scope surface and operation surface disagree.
- >-
  SupportMessage has no id, so an individual message cannot be addressed, edited or deduplicated.
- >-
  No entity carries an `object` or `type` discriminator field, and ids have no prefixes, so a
  polymorphic response cannot be type-switched.
