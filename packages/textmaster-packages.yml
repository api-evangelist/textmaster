  ecosystems_covered: [php]
  ecosystems_absent: [javascript, python, ruby, java, dotnet, go, rust]
  note: >-
    TextMaster is a PHP-only SDK shop. All three first-party packages are on Packagist under the
    `textmaster/` vendor namespace and all three are sourced from github.com/textmaster, which is
    what establishes them as first-party. There is no official JavaScript, Python, Ruby, Java, .NET,
    Go or Rust client — PyPI has no `textmaster` project at all, and the only npm package named
    `textmaster` belongs to Localize (a third party). Two of the three first-party packages are
    e-commerce/PIM connectors rather than API clients; the actual API client is
    `textmaster/textmaster-api`.
  decay_signal: >-
    Every first-party package is stale relative to the API it wraps. The PHP API client last shipped
    2024-02-14, the Akeneo extension 2021-08-19, the Magento 2 module 2025-02-17 — while the live
    OpenAPI is served today and the platform's TLS certs were reissued 2026-08-11. The Akeneo
    extension is ~5 years behind despite akeneo.textmaster.com being an actively monitored
    production host on the status page. Nothing here has been touched since the Acolad transition.
