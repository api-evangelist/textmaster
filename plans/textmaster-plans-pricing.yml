summary: >-
  TextMaster publishes NO plans and NO prices. There are no tiers, no per-word rate card, no
  self-serve price list and no enterprise price on any TextMaster host as of 2026-08-17. The
  commercial model is not subscription tiers at all: it is a PREPAID CREDIT WALLET plus per-project
  quotation. A client buys credit bundles, then each project is priced at launch time by the API
  itself and debited from the balance. This is a genuine zero on `plan_count`, and it is a zero for
  two compounding reasons — the model was never tier-based, and the marketing site that once
  carried the per-word rate card has been reduced to a three-URL Acolad transition page.
