divergence_summary: >-
  The three surfaces do not agree, and the gap is asymmetric. REST is complete (54 operations). The
  webhook surface exposes 19 events that REST cannot deliver — a status change is only observable in
  real time by push, and there is no events-poll endpoint. MCP does not exist. So the union of
  TextMaster's agent-reachable capability today is: everything in REST, reachable only by writing
  your own client, with the real-time layer available only if you also operate an HTTPS receiver.
