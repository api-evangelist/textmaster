agent_readiness_context: >-
  Worth stating plainly, because it is the interesting finding: TextMaster has no MCP server but is
  otherwise unusually well set up to have one. It publishes a complete OpenAPI, a scope model with a
  single money-moving scope (project:launch) that maps cleanly onto a human-in-the-loop boundary, a
  separate sandbox host, an llms.txt on both documentation spaces, a Content-Signal declaration
  permitting ai-input, and a robots.txt that individually allowlists nineteen AI crawlers "for AIO
  discoverability". The provider has opted into agent consumption at the content layer without
  shipping an agent-callable surface at the API layer.
